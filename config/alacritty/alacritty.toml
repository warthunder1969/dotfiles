[font]
normal = { family = "Fira Code", style = "Regular" }
bold = { family = "Fira Code", style = "bold" }
italic = { family = "Fira Code", style = "italic" }
bold_italic = { family = "Fira Code", style = "bold italic" }
size = 12

[window]
opacity = 0.9

[window.dimensions]
columns = 100
lines = 25

[window.padding]
x = 6
y = 6

[colors.primary]
foreground = "#ffffff" # White
background = "#242424" # Black

[colors.normal]
black = "#000000"
red = "#ff3b30"
green = "#4cd964"
yellow = "#ffcc00"
blue = "#007aff"
magenta = "#ff2d55"
cyan = "#5ac8fa"
white = "#ffffff"

[colors.bright]
black = "#686868"
red = "#ff3b30"
green = "#4cd964"
yellow = "#ffcc00"
blue = "#007aff"
magenta = "#ff2d55"
cyan = "#5ac8fa"
white = "#ffffff"

[cursor]
style = { shape = "Beam", blinking = "On" }
