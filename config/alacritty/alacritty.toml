live_config_reload = true
import = ["~/.config/alacritty/themes/themes/horizon_dark.toml"]

[cursor]
unfocused_hollow = false

[cursor.style]
blinking = "On"
shape = "Beam"

[env]
TERM = "xterm-256color"

[window]
decorations = "Buttonless"
opacity = 0.9
blur = true 
startup_mode = "Windowed"

[window.dimensions]
columns = 82
lines = 24

[window.padding]
x = 19
y = 19

[font]
normal.family = "Fira Code"
size = 12

