import = ["~/.config/alacritty/themes/kitty.toml"]

live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
opacity = 0.9
blur = true

[window.dimensions]
columns = 100
lines = 30

[font]
size = 12.0

[font.normal]
family = "Noto Sans Mono"
style = "Regular"

[font.bold]
family = "Noto Sans Mono"
style = "Bold"

[font.italic]
family = "Noto Sans Mono"
style = "Italic"

[font.bold_italic]
family = "Noto Sans Mono"
style = "Bold Italic"

